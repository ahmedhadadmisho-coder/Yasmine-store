<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الياسمين لمواد التنظيف</title>
  <style>
    :root {
      --green: #1e8c3e;
      --red: #e0141e;
      --bg: #ffffff;
      --text: #1d2b22;
      --muted: #5d6b62;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: Tahoma, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      overflow-x: hidden;
    }

    .bg-icons {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .ico {
      position: absolute;
      bottom: -60px;
      left: var(--x);
      font-size: var(--size);
      opacity: 0.18;
      filter: grayscale(100%);
      animation-name: float, sway;
      animation-duration: var(--d), 6s;
      animation-delay: var(--delay), 0s;
      animation-iteration-count: infinite, infinite;
      animation-timing-function: linear, ease-in-out;
      animation-direction: normal, alternate;
    }

    @keyframes float {
      from { transform: translateY(0) rotate(0deg); }
      to { transform: translateY(-120vh) rotate(25deg); }
    }

    @keyframes sway {
      from { translate: -25px 0; }
      to { translate: 25px 0; }
    }

    .hero {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      padding: 40px 24px;
      text-align: center;
    }

    .logo-img {
      width: 100%;
      max-width: 300px;
      height: auto;
      margin-bottom: 24px;
      mix-blend-mode: multiply;
    }

    .hero h1 {
      margin: 0 0 6px;
      font-size: 30px;
      color: var(--green);
    }

    .hero p {
      margin: 0;
      color: var(--muted);
    }

    .welcome {
      margin-top: 16px;
      font-size: 18px;
      font-weight: bold;
      color: var(--text);
    }

    .btn {
      display: inline-block;
      margin-top: 28px;
      padding: 14px 36px;
      border-radius: 999px;
      background: var(--red);
      color: #ffffff;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 6px 18px rgba(224, 20, 30, 0.3);
    }

    @media (prefers-reduced-motion: reduce) {
      .ico { animation: none; display: none; }
    }
  </style>
</head>
<body>
  <div class="bg-icons" aria-hidden="true">
    <span class="ico" style="--x:5%; --size:34px; --d:18s; --delay:-2s;">🧴</span>
    <span class="ico" style="--x:15%; --size:44px; --d:22s; --delay:-9s;">🧽</span>
    <span class="ico" style="--x:27%; --size:30px; --d:16s; --delay:-5s;">🧹</span>
    <span class="ico" style="--x:38%; --size:40px; --d:20s; --delay:-12s;">🫧</span>
    <span class="ico" style="--x:50%; --size:36px; --d:17s; --delay:-7s;">🧼</span>
    <span class="ico" style="--x:62%; --size:46px; --d:23s; --delay:-14s;">🪣</span>
    <span class="ico" style="--x:73%; --size:32px; --d:15s; --delay:-3s;">🧺</span>
    <span class="ico" style="--x:84%; --size:38px; --d:21s; --delay:-10s;">🧻</span>
    <span class="ico" style="--x:92%; --size:42px; --d:19s; --delay:-6s;">🧯</span>
    <span class="ico" style="--x:33%; --size:28px; --d:24s; --delay:-16s;">🪥</span>
  </div>

  <div class="hero">
    <img src="logo.png" alt="شعار الياسمين" class="logo-img">
    <h1>الياسمين</h1>
    <p>لمواد التنظيف</p>
    <p class="welcome">عالم النظافة بين يديك</p>
    <a href="products.html" class="btn">ادخل إلى الياسمين</a>
  </div>
</body>
</html>
